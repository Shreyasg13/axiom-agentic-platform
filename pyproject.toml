[project]
name = "axiom-agentic-platform"
version = "1.0.0"
description = "Hybrid Multi-Provider AI Agent Orchestration Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentex-sdk>=0.6.7",
    "requests>=2.32.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["project"]

[tool.uv]
dev-dependencies = []
